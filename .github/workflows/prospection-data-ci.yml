name: Rcvo Prospection Data CI

on:
  push:
    branches:
      - "foundation/rcvo-prospection-data-v1"
    paths:
      - "prospection-data/**"
      - ".github/workflows/prospection-data-ci.yml"
  pull_request:
    paths:
      - "prospection-data/**"
      - ".github/workflows/prospection-data-ci.yml"

permissions:
  contents: read

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prospection-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ingestion dependencies
        run: python -m pip install -r requirements-ingestion.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: SQLite batch benchmark 250k
        run: python scripts/benchmark_ingest.py --rows 250000
      - name: End-to-end RAW file benchmark 100k
        run: python scripts/benchmark_raw_file.py --rows 100000
      - name: SQLite maintenance smoke test
        run: |
          python src/rcvo_ingest.py --data-dir /tmp/rcvo-prospection-ci init
          python scripts/raw_maintenance.py --data-dir /tmp/rcvo-prospection-ci
