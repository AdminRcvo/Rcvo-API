name: Rcvo Prospection Data CI

on:
  push:
    branches:
      - "foundation/rcvo-prospection-data-v1"
    paths:
      - "prospection-data/**"
      - ".github/workflows/prospection-data-ci.yml"
  pull_request:
    paths:
      - "prospection-data/**"
      - ".github/workflows/prospection-data-ci.yml"

permissions:
  contents: read

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prospection-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ingestion smoke benchmark
        run: python scripts/benchmark_ingest.py --rows 50000
